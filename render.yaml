# InfraScan Cloud Deployment Blueprint (Render.com)
# Milestone 4: Production Deployment Specification

services:
  # 1. FastAPI AI & Backend Web Service (Docker with OpenCV/libGL + YOLOv11)
  - type: web
    name: infrascan-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    branch: Prashun-Mishra
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: UPLOAD_DIR
        value: "/app/backend/uploads"
    healthCheckPath: /health

  # 2. Next.js 14 Frontend Web Service
  - type: web
    name: infrascan-frontend
    env: node
    region: oregon
    plan: free
    branch: Prashun-Mishra
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: infrascan-backend
          property: host
